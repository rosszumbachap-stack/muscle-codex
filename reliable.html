<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#21170f"><title>Muscle Codex — Reliable Edition</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--paper:#d6c196;--ink:#241a12;--red:#70261c;--line:#927b5b}
*{box-sizing:border-box}body{margin:0;background:#1b140f;color:var(--ink);font-family:Georgia,serif}
header{background:#251a12;color:#e5d2a9;padding:20px 18px;border-bottom:4px solid #8a3025}header small{font:700 10px Arial;letter-spacing:3px}header h1{margin:8px 0 0;font:900 32px Arial;letter-spacing:1px;text-transform:uppercase}
main{max-width:780px;margin:auto;background:var(--paper);min-height:100vh;padding:18px 16px 100px;background-image:linear-gradient(90deg,rgba(65,38,15,.035) 1px,transparent 1px);background-size:32px 32px}
nav{display:flex;gap:8px;margin-bottom:18px}button{cursor:pointer;font-family:Arial,sans-serif;font-weight:800;letter-spacing:.04em}nav button{flex:1;background:transparent;border:2px solid var(--ink);padding:14px;color:var(--ink)}nav button.active,.primary{background:var(--red);color:white;border:2px solid var(--red)}
h2{font:900 25px Arial;margin:12px 0}h3{font:900 19px Arial;margin:0 0 7px}p{line-height:1.5}.hero{display:grid;grid-template-columns:1fr 120px;gap:12px;border:2px solid var(--ink);padding:14px;background:#e4d1a9}.hero img{width:100%;height:180px;object-fit:cover}.eyebrow{font:800 11px Arial;color:var(--red);letter-spacing:1px;text-transform:uppercase}
.exercise{display:grid;grid-template-columns:1fr auto;gap:8px;border:1px solid var(--ink);padding:15px 12px;margin:11px 0;background:#e6d4ae}.exercise p{font:700 12px Arial;color:#604b38;margin:7px 0}.exercise button.study{background:transparent;border:2px solid var(--ink);padding:11px 12px;color:var(--ink)}.exercise button.done{background:transparent;border:2px solid var(--ink);width:44px;height:44px;font-size:22px;color:var(--ink)}.exercise button.done.checked{background:var(--red);color:white}
.controls{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:15px;background:var(--ink);color:#e6d2a7;margin-top:20px}.primary{padding:12px}.day{border:2px solid var(--ink);margin:12px 0;background:#e6d4ae;overflow:hidden}.day img{width:100%;height:150px;object-fit:cover;display:block}.day .inside{padding:15px}.day li{padding:4px 0}.day button{width:100%;padding:12px;background:var(--red);color:white;border:0}
#overlay[hidden],section[hidden]{display:none!important}#overlay{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.84);display:flex;align-items:center;justify-content:center;padding:10px}
.modal{background:var(--paper);color:var(--ink);width:min(100%,650px);max-height:94dvh;overflow:auto;border:3px solid var(--ink);padding:16px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head button{background:var(--ink);color:white;border:0;padding:10px 14px;font-size:18px}.modal img{width:100%;height:230px;object-fit:contain;background:#d9c49d}.tabs{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0}.tabs button{padding:9px;background:transparent;border:1px solid var(--ink);color:var(--ink)}.tabs button.active{background:var(--ink);color:white}.logrow{display:flex;gap:8px;margin:10px 0}.logrow input{min-width:0;width:50%;padding:12px;font-size:16px;border:1px solid var(--ink);background:#f3e4c4}
@media(max-width:400px){.hero{grid-template-columns:1fr 100px}.hero img{height:155px}.exercise{grid-template-columns:1fr}.exercise .actions{display:flex;gap:8px}}
</style></head>
<body><header><small>ANATOMICAL TRAINING · V2.0</small><h1>Muscle Codex</h1></header><main>
<nav><button id="todayNav" class="active" type="button">Today's Study</button><button id="weekNav" type="button">Weekly Program</button></nav>
<section id="today"><div class="hero"><div><span class="eyebrow" id="dayTag">DAY 01</span><h2 id="dayTitle">Glutes & Chest</h2><p>Five-day full-body training with emphasis on glute development.</p><span class="eyebrow" id="progress">0 / 7 COMPLETE</span></div><img src="images/hero-dynamic.webp" alt="Anatomical figure"></div><h2>Sequence of Movements</h2><div id="exercises"></div><div class="controls"><div><small>SESSION TIME</small><div id="timer" style="font-size:24px">00:00</div></div><button class="primary" id="timerButton">Begin Session</button></div></section>
<section id="week" hidden><h2>The Complete Week</h2><p>Five training days, two recovery days.</p><div id="days"></div></section>
</main>
<div id="overlay" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-head"><span class="eyebrow">ANATOMICAL EXERCISE STUDY</span><button id="close" type="button">Close ×</button></div><h2 id="modalTitle"></h2><img id="modalImg" src="images/atlas-character-front.webp" alt="Anatomical movement illustration"><div class="tabs"><button data-tab="anatomy" class="active">Anatomy</button><button data-tab="technique">Technique</button><button data-tab="log">Training Log</button></div><div id="modalBody"></div></div></div>
<script>
'use strict';
const DAYS=[["Glutes & Chest",[["5-Minute Kettlebell Circuit","5 min","warmup"],["Barbell Glute Bridge","4 × 8–10","bridge"],["Incline Dumbbell Press","3 × 8–12","incline"],["Lat Pulldown","3 × 8–12","pulldown"],["Bulgarian Split Squat","3 × 10/leg","split"],["Lateral Raise","3 × 15","lateral"],["Cable Crunch","2 × 12–15","crunch"]]],["Hamstrings & Back",[["5-Minute Kettlebell Circuit","5 min","warmup"],["Deficit Cable Romanian Deadlift","3 × 10–12","rdl"],["Single-Leg Hamstring Curl","3 × 10–12/leg","curl"],["Chest-Supported Row","3 × 8–12","row"],["Machine Chest Press","2 × 10–12","press"],["Rear Delt Fly","3 × 12–15","rear"],["Hammer Curl","3 × 10–12","curl"]]],["Quads & Shoulders",[["5-Minute Kettlebell Circuit","5 min","warmup"],["Hack Squat","3 × 8–12","hack"],["Seated Dumbbell Shoulder Press","3 × 8–10","press"],["Assisted Pull-Up","3 × 8–10","pulldown"],["Cable Chest Fly","2 × 12–15","incline"],["Hip Abduction Machine","3 × 15–20","split"],["Standing Calf Raise","3 × 12–15","hack"]]],["Glutes & Upper Body",[["5-Minute Kettlebell Circuit","5 min","warmup"],["Barbell Glute Bridge","3 × 12","bridge"],["Incline Bench Press","3 × 8–10","incline"],["Seated Cable Row","3 × 10–12","row"],["Reverse Lunge","2 × 10/leg","split"],["Cable Lateral Raise","3 × 12–15","lateral"],["Triceps Pushdown","3 × 12","triceps"]]],["Full-Body Athletic",[["5-Minute Kettlebell Circuit","5 min","warmup"],["Goblet Squat","3 × 12","hack"],["Single-Leg Hamstring Curl","2 × 12/leg","curl"],["Neutral-Grip Pulldown","3 × 10","pulldown"],["Push-Up","3 × 10–15","press"],["Face Pull","3 × 15","rear"],["Farmer Carry","3 × 30–40 m","row"]]],["Recovery & Reset",[]],["Rest & Prepare",[]]];
const IMAGES={warmup:'images/hero-dynamic.webp',bridge:'images/atlas-character-back.webp',incline:'images/movements/incline-start.webp',pulldown:'images/movements/pulldown-start.webp',split:'images/movements/hack-start.webp',lateral:'images/movements/lateral-start.webp',crunch:'images/atlas-character-front.webp',rdl:'images/movements/rdl-start.webp',curl:'images/movements/curl-start.webp',row:'images/movements/pulldown-start.webp',press:'images/movements/incline-start.webp',rear:'images/atlas-character-back.webp',hack:'images/movements/hack-start.webp',triceps:'images/movements/triceps-start.webp'};
const NOTES={bridge:'Brace your trunk, keep ribs stacked over pelvis, and drive through your feet. Pause at the top without arching your lower back.',incline:'Keep your wrists stacked and shoulder blades stable. Lower under control and press smoothly.',pulldown:'Let the shoulder blades rise, then draw your elbows down toward your sides.',rdl:'Hinge from the hips with a stable spine and controlled descent.',hack:'Maintain foot pressure and track your knees with your toes.',split:'Keep the front foot planted and lower under control.',lateral:'Raise with the upper arms; avoid shrugging or swinging.',curl:'Keep the upper arm stable and move through the elbow.',warmup:'Move through a light kettlebell squat, reverse lunge, hip hinge, goblet squat, and suitcase march for one minute each.'};
const $=id=>document.getElementById(id);
let day=Number(localStorage.getItem('codex-lite-day')||0);if(!Number.isInteger(day)||day<0||day>6)day=0;
let active=0,tab='anatomy',running=false,elapsed=0,timerId=null;
const doneKey=()=> 'codex-lite-done-'+day;
const done=()=>{try{return JSON.parse(localStorage.getItem(doneKey())||'[]')}catch{return []}};
function showPage(page){$('today').hidden=page!=='today';$('week').hidden=page!=='week';$('todayNav').classList.toggle('active',page==='today');$('weekNav').classList.toggle('active',page==='week');window.scrollTo(0,0)}
function render(){const exercises=DAYS[day][1],completed=done();$('dayTag').textContent='DAY '+String(day+1).padStart(2,'0');$('dayTitle').textContent=DAYS[day][0];$('progress').textContent=completed.length+' / '+exercises.length+' COMPLETE';$('exercises').innerHTML=exercises.length?exercises.map((e,i)=>'<article class="exercise"><div><h3>'+e[0]+'</h3><p>'+e[1]+'</p></div><div class="actions"><button class="study" type="button" data-study="'+i+'">Study Anatomy</button> <button class="done '+(completed.includes(i)?'checked':'')+'" type="button" data-done="'+i+'" aria-label="Mark complete">✓</button></div></article>').join(''):'<p>Recovery day. Gentle walking and mobility as desired.</p>';}
function renderWeek(){$('days').innerHTML=DAYS.map((d,i)=>'<article class="day"><img src="'+(i<5?IMAGES[d[1][1]?.[2]]||'images/hero-dynamic.webp':'images/atlas-character-back.webp')+'" alt="Anatomy illustration"><div class="inside"><h3>DAY '+(i+1)+' · '+d[0]+'</h3><ol>'+d[1].map(e=>'<li>'+e[0]+' — '+e[1]+'</li>').join('')+'</ol><button type="button" data-day="'+i+'">Load this day</button></div></article>').join('')}
function openStudy(i){active=i;tab='anatomy';const e=DAYS[day][1][i];$('modalTitle').textContent=e[0];$('modalImg').src=IMAGES[e[2]]||'images/atlas-character-front.webp';$('overlay').hidden=false;renderTab();}
function renderTab(){const e=DAYS[day][1][active];document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const key='codex-lite-log-'+day+'-'+active;
if(tab==='anatomy')$('modalBody').innerHTML='<h3>Movement focus</h3><p>'+e[0]+' · '+e[1]+'</p><p>This illustration is a general anatomical reference, not an exact exercise demonstration.</p>';
if(tab==='technique')$('modalBody').innerHTML='<h3>Execution cues</h3><p>'+(NOTES[e[2]]||'Move slowly through a controlled range of motion. Keep a stable trunk and avoid using momentum.')+'</p>';
if(tab==='log'){$('modalBody').innerHTML='<h3>Record your work</h3><div class="logrow"><input id="load" inputmode="decimal" placeholder="Weight (lb)"><input id="reps" inputmode="numeric" placeholder="Reps completed"></div><button id="save" class="primary" type="button">Save Set</button><p id="saved"></p>';const data=JSON.parse(localStorage.getItem(key)||'{}');$('load').value=data.load||'';$('reps').value=data.reps||'';$('save').onclick=()=>{localStorage.setItem(key,JSON.stringify({load:$('load').value,reps:$('reps').value}));$('saved').textContent='Saved on this device.'}}}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.hasAttribute('data-study'))openStudy(Number(b.dataset.study));else if(b.hasAttribute('data-done')){const i=Number(b.dataset.done),v=done();localStorage.setItem(doneKey(),JSON.stringify(v.includes(i)?v.filter(x=>x!==i):[...v,i]));render()}else if(b.hasAttribute('data-day')){day=Number(b.dataset.day);localStorage.setItem('codex-lite-day',day);render();showPage('today')}else if(b.hasAttribute('data-tab')){tab=b.dataset.tab;renderTab()}});
$('todayNav').onclick=()=>showPage('today');$('weekNav').onclick=()=>showPage('week');$('close').onclick=()=>{$('overlay').hidden=true};$('overlay').onclick=e=>{if(e.target===$('overlay'))$('overlay').hidden=true};
$('timerButton').onclick=()=>{running=!running;$('timerButton').textContent=running?'Pause':'Resume';if(timerId)clearInterval(timerId);if(running)timerId=setInterval(()=>{elapsed++;$('timer').textContent=String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(elapsed%60).padStart(2,'0')},1000)};
render();renderWeek();
</script></body></html>
